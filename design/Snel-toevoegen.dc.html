<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Andere overlegmomenten toevoegen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#5B6478}
a{color:#0B5FD8}a:hover{color:#08449C}
</style>
</helmet>
<div style="font-family: 'Nunito', system-ui, sans-serif; color: #16213A; min-height: 900px; background: linear-gradient(90deg, #0C2A5E 0px, #0C2A5E 240px, #8A93A6 240px); display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box">
  <div role="dialog" aria-labelledby="dlg-title" style="width: 100%; max-width: 640px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 30px 80px rgba(10,20,40,0.35); padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1">
        <h2 id="dlg-title" style="margin: 0; font-size: 24px; font-weight: 800">Je andere vaste overlegmomenten</h2>
        <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: #3E4860">Naam en ritme volstaan. Elk overleg krijgt dezelfde eenvoudige startagenda.</p>
      </div>
      <button type="button" aria-label="Sluiten" style="background: none; border: none; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16213A" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #5B6478">Gevonden in je Outlook-agenda</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="display: grid; grid-template-columns: 24px minmax(0, 1fr) 190px; gap: 12px; align-items: center; border: 1px solid #C9D3E3; border-radius: 10px; padding: 10px 12px">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B5FD8; margin: 0">
        <span style="font-size: 15px; font-weight: 700">Managementoverleg</span>
        <span style="font-size: 14px; color: #3E4860">Om de 2 weken · di 14:00</span>
      </label>
      <label style="display: grid; grid-template-columns: 24px minmax(0, 1fr) 190px; gap: 12px; align-items: center; border: 1px solid #C9D3E3; border-radius: 10px; padding: 10px 12px">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B5FD8; margin: 0">
        <span style="font-size: 15px; font-weight: 700">Veiligheidsoverleg</span>
        <span style="font-size: 14px; color: #3E4860">Maandelijks · do 10:00</span>
      </label>
      <label style="display: grid; grid-template-columns: 24px minmax(0, 1fr) 190px; gap: 12px; align-items: center; border: 1px solid #C9D3E3; border-radius: 10px; padding: 10px 12px">
        <input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B5FD8; margin: 0">
        <span style="font-size: 15px; font-weight: 700">Weekstart sales</span>
        <span style="font-size: 14px; color: #3E4860">Elke week · ma 09:30</span>
      </label>
    </div>

    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #5B6478">Zelf toevoegen</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px">
        <input type="text" aria-label="Naam overleg" value="Kwaliteitsoverleg" style="font-family: inherit; font-size: 15px; padding: 12px; border: 1px solid #C9D3E3; border-radius: 10px; color: #16213A; min-width: 0">
        <select aria-label="Ritme" style="font-family: inherit; font-size: 15px; padding: 12px; border: 1px solid #C9D3E3; border-radius: 10px; background: #FFFFFF; color: #16213A"><option>Maandelijks</option><option>Elke week</option><option>Om de 2 weken</option><option>Per kwartaal</option><option>Eenmalig</option></select>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px">
        <input type="text" aria-label="Naam nieuw overleg" placeholder="Typ een naam en druk Enter" style="font-family: inherit; font-size: 15px; padding: 12px; border: 2px solid #0B5FD8; border-radius: 10px; color: #16213A; min-width: 0">
        <select aria-label="Ritme nieuw overleg" style="font-family: inherit; font-size: 15px; padding: 12px; border: 1px solid #C9D3E3; border-radius: 10px; background: #FFFFFF; color: #5B6478"><option>Ritme</option></select>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <span style="font-size: 13px; color: #5B6478; font-weight: 600">Suggesties:</span>
        <button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; background: #FFFFFF; color: #16213A; border: 1px solid #C9D3E3; border-radius: 999px; padding: 6px 12px; min-height: 34px">+ Planningsoverleg</button>
        <button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; background: #FFFFFF; color: #16213A; border: 1px solid #C9D3E3; border-radius: 999px; padding: 6px 12px; min-height: 34px">+ Raad van bestuur</button>
        <button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; background: #FFFFFF; color: #16213A; border: 1px solid #C9D3E3; border-radius: 999px; padding: 6px 12px; min-height: 34px">+ Teamoverleg</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px; padding-top: 6px; border-top: 1px solid #EEF2F8">
      <button type="button" style="font-family: inherit; background: none; border: none; font-size: 15px; font-weight: 700; color: #3E4860; min-height: 46px; padding: 0 12px; cursor: pointer">Later</button>
      <button type="button" style="font-family: inherit; background: #0B5FD8; color: #FFFFFF; border: none; border-radius: 10px; padding: 0 22px; min-height: 46px; font-size: 15px; font-weight: 700; cursor: pointer">3 overleggen toevoegen</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

renderVals() {
return {};
}
}
</script>
</body>
</html>
